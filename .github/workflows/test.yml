name: Test the app code

# Runs the smoke test (every screen + the buy/pay flow against a fake API) whenever app code changes.
on:
  push:
    paths: ['app/**', 'tests/**', 'scripts/**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/smoke.mjs
